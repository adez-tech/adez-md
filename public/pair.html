<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADEZ-MD Pairing System</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #111b21; color: #e9edef; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #222e35; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); text-align: center; max-width: 400px; width: 90%; }
        h2 { color: #00a884; margin-top: 0; }
        p { color: #8696a0; font-size: 14px; }
        input { width: 100%; padding: 12px; margin: 15px 0; border: 1px solid #2a3942; background: #2a3942; border-radius: 6px; color: white; font-size: 16px; box-sizing: border-box; text-align: center; }
        input:focus { border-color: #00a884; outline: none; }
        button { background: #00a884; color: #111b21; border: none; padding: 12px 24px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; width: 100%; transition: background 0.2s; }
        button:hover { background: #008769; }
        .code-box { display: none; background: #111b21; padding: 15px; border-radius: 6px; border: 2px dashed #00a884; margin-top: 20px; font-size: 24px; font-weight: bold; letter-spacing: 4px; color: #00a884; cursor: pointer; }
        .loading { display: none; color: #f1c40f; margin-top: 15px; font-style: italic; }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>

<div class="card">
    <h2>ADEZ-MD Bot Linker</h2>
    <p>Enter your WhatsApp number with country code (e.g., 254111783552) to get your 8-digit connection code.</p>
    
    <input type="text" id="phoneNumber" placeholder="254111783552" />
    <button id="btn">Get Pairing Code</button>
    
    <div id="loading" class="loading">Generating code from WhatsApp servers...</div>
    <div id="codeBox" class="code-box" title="Click to copy">--------</div>
</div>

<script>
    const socket = io();
    const phoneInput = document.getElementById('phoneNumber');
    const btn = document.getElementById('btn');
    const loading = document.getElementById('loading');
    const codeBox = document.getElementById('codeBox');

    btn.addEventListener('click', () => {
        const number = phoneInput.value.replace(/[^0-9]/g, '');
        if(!number) return alert('Please enter a valid phone number!');
        
        btn.style.display = 'none';
        loading.style.display = 'block';
        codeBox.style.display = 'none';
        
        // Send number to server
        socket.emit('request_code', number);
    });

    socket.on('pairing_code', (code) => {
        loading.style.display = 'none';
        codeBox.style.display = 'block';
        codeBox.innerText = code;
    });

    socket.on('pairing_error', (err) => {
        alert(err);
        btn.style.display = 'block';
        loading.style.display = 'none';
    });

    codeBox.addEventListener('click', () => {
        navigator.clipboard.writeText(codeBox.innerText);
        alert('Code copied to clipboard! Paste it into WhatsApp settings -> Linked Devices -> Link with phone number.');
    });
</script>

</body>
</html>
